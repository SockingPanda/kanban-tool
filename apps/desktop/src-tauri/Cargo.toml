[package]
name = "kanban-desktop"
edition.workspace = true
version = "1.2.0"
license.workspace = true
authors.workspace = true

[lib]
name = "kanban_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kanban-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum.workspace = true
kanban-local.workspace = true
kanban-server = { workspace = true, features = ["vector-lancedb"] }
kanban-sqlite.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
