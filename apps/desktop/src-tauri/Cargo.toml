[package]
name = "kanban-desktop"
edition.workspace = true
version = "1.5.2"
license.workspace = true
authors.workspace = true

[lib]
name = "kanban_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kanban-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum.workspace = true
kanban-local.workspace = true
kanban-server.workspace = true
kanban-sqlite.workspace = true
serde.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.5", default-features = false, features = ["tokio", "blocking"] }
