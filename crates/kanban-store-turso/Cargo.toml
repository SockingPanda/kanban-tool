[package]
name = "kanban-store-turso"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
legacy-sqlite-import = ["dep:rusqlite"]

[dependencies]
kanban-core.workspace = true
sha2.workspace = true
rusqlite = { workspace = true, optional = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
turso = { workspace = true, default-features = false, features = ["fts"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
