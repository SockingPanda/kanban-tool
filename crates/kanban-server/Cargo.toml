[package]
name = "kanban-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
autotests = false

[features]
default = []
legacy-sqlite-import = ["kanban-service/legacy-sqlite-import"]

[dependencies]
axum.workspace = true
kanban-service.workspace = true
kanban-protocol = { workspace = true, default-features = false }
kanban-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml.workspace = true
tower-http = { workspace = true, features = ["cors", "trace"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
