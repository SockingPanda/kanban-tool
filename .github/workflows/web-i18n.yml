name: Web i18n

on:
  pull_request:
    paths: ["apps/web/**", "pnpm-lock.yaml", "package.json", "justfile", ".github/workflows/web-i18n.yml"]
  push:
    branches: [v4]
    paths: ["apps/web/**", "pnpm-lock.yaml", "package.json", "justfile", ".github/workflows/web-i18n.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.57.0
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: just node-lock-check
      - run: pnpm install --frozen-lockfile
      - run: just web-i18n-check
      - run: just web-i18n-test
      - run: just web-typecheck
      - run: just web-test
      - run: just web-build
