[package]
name = "kanban-contract"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false
autolib = false
build = false

[lib]
name = "kanban_contract"
path = "src/lib.rs"

[[test]]
name = "foundation"
path = "tests/foundation.rs"

[[test]]
name = "g0_metadata"
path = "tests/g0_metadata.rs"

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
