[workspace]
members = [
  "crates/kanban-core",
  "crates/kanban-application",
  "crates/kanban-contract",
  "xtask",
  "crates/kanban-store-turso",
  "crates/kanban-client",
  "crates/kanban-cli",
  "crates/kanban-mcp",
  "crates/kanban-server",
  "apps/desktop/src-tauri",
]
exclude = [
  "crates/kanban-context",
  "crates/kanban-derived-io",
  "crates/kanban-entity",
  "crates/kanban-graph",
  "crates/kanban-graph-oxigraph",
  "crates/kanban-helper-protocol",
  "crates/kanban-indexer",
  "crates/kanban-labels",
  "crates/kanban-search",
  "crates/kanban-vector",
  "crates/kanban-vector-lancedb",
]
default-members = [
  "crates/kanban-core",
  "crates/kanban-application",
  "crates/kanban-contract",
  "crates/kanban-store-turso",
  "crates/kanban-client",
  "crates/kanban-cli",
  "crates/kanban-mcp",
  "crates/kanban-server",
]
resolver = "3"

[profile.dev]
incremental = false

[workspace.package]
edition = "2024"
version = "2.1.3"
license = "Apache-2.0"
authors = ["SockingPanda"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
clap = { version = "4.5", features = ["derive", "env"] }
dirs-next = "2.0"
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1.20"
schemars = { version = "1.2.1", default-features = false, features = ["std", "derive"] }
jsonschema = { version = "0.47.0", default-features = false }
sha2 = "0.10"
strum = { version = "0.26", features = ["derive"] }
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["json"] }
tempfile = "3.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.38", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
ulid = "1.1"
turso = { version = "=0.7.2", default-features = false }
rmcp = { version = "=3.1.0", default-features = false, features = ["server", "transport-io", "macros"] }

kanban-core = { path = "crates/kanban-core" }
kanban-application = { path = "crates/kanban-application" }
kanban-contract = { path = "crates/kanban-contract", default-features = false }
kanban-store-turso = { path = "crates/kanban-store-turso" }
kanban-client = { path = "crates/kanban-client" }
kanban-server = { path = "crates/kanban-server" }
