name: PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      repo_meta: ${{ steps.filter.outputs.repo_meta }}
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop-rust: ${{ steps.filter.outputs.desktop-rust }}
      dependency_audit: ${{ steps.filter.outputs.dependency_audit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            repo_meta:
              - '.github/workflows/**'
              - '.config/nextest.toml'
              - 'AGENTS.md'
              - 'README.md'
              - 'docs/**'
              - 'justfile'
              - 'Justfile'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - 'scripts/*.sh'
              - 'scripts/**/*.sh'
            dependency_audit:
              - '.github/workflows/**'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'justfile'
              - 'Justfile'
            rust:
              - '.github/workflows/**'
              - '.config/nextest.toml'
              - 'AGENTS.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'Justfile'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'migrations/**'
              - 'scripts/*.sh'
              - 'scripts/**/*.sh'
            desktop:
              - '.github/workflows/**'
              - 'apps/desktop/components.json'
              - 'apps/desktop/eslint.config.js'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/pnpm-lock.yaml'
              - 'apps/desktop/public/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/tsconfig*.json'
              - 'apps/desktop/vite.config.ts'
            desktop-rust:
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'migrations/**'
              # Keep this allowlist in sync with kanban-desktop's Rust dependency graph.
              - 'crates/kanban-application/**'
              - 'crates/kanban-contract/**'
              - 'crates/kanban-core/**'
              - 'crates/kanban-context/**'
              - 'crates/kanban-derived-io/**'
              - 'crates/kanban-entity/**'
              - 'crates/kanban-graph/**'
              - 'crates/kanban-graph-oxigraph/**'
              - 'crates/kanban-helper-protocol/**'
              - 'crates/kanban-indexer/**'
              - 'crates/kanban-labels/**'
              - 'crates/kanban-local/**'
              - 'crates/kanban-search/**'
              - 'crates/kanban-server/**'
              - 'crates/kanban-sqlite/**'
              - 'crates/kanban-vector/**'
              - 'crates/kanban-vector-lancedb/**'
              - 'apps/desktop/src-tauri/**'
              - 'scripts/cargo-build-lock.sh'
              - 'scripts/prepare-desktop-helper-binaries.sh'
              - 'scripts/test-desktop-helper-sidecars.sh'

  repo-meta:
    name: Repo metadata checks
    needs: changes
    if: needs.changes.outputs.repo_meta == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Check shell scripts
        run: |
          mapfile -d '' scripts < <(find scripts -type f -name '*.sh' -print0 | sort -z)
          if ((${#scripts[@]} == 0)); then
            echo "No scripts/**/*.sh files found"
          else
            for script in "${scripts[@]}"; do
              bash -n "$script"
            done
          fi
      - name: List just recipes
        run: just --list

  rust-default:
    name: Rust default features
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Check workspace
        run: cargo check --workspace --exclude kanban-desktop --tests
      - name: Test workspace
        run: cargo nextest run --workspace --exclude kanban-desktop --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude kanban-desktop -- -D warnings

  desktop:
    name: Desktop checks
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  desktop-rust:
    name: Desktop Rust checks
    needs: changes
    if: needs.changes.outputs.desktop-rust == 'true'
    runs-on: ubuntu-latest
    env:
      KANBAN_CARGO_TARGET_ROOT: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Prepare Tauri sidecars
        run: |
          bash scripts/prepare-desktop-helper-binaries.sh
          bash scripts/test-desktop-helper-sidecars.sh
      - name: Check Tauri Rust
        run: cargo check -p kanban-desktop --tests

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.dependency_audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-audit
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Audit dependencies
        run: just audit

  pr-result:
    name: PR result
    needs:
      - changes
      - repo-meta
      - rust-default
      - desktop
      - desktop-rust
      - dependency-audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          changes_result='${{ needs.changes.result }}'
          repo_meta_result='${{ needs.repo-meta.result }}'
          rust_result='${{ needs.rust-default.result }}'
          desktop_result='${{ needs.desktop.result }}'
          desktop_rust_result='${{ needs.desktop-rust.result }}'
          dependency_audit_result='${{ needs.dependency-audit.result }}'
          if [[ "$changes_result" != "success" ]]; then
            echo "Changed-path detection finished with result: $changes_result"
            exit 1
          fi
          for result in "$repo_meta_result" "$rust_result" "$desktop_result" "$desktop_rust_result" "$dependency_audit_result"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A gated PR job finished with result: $result"; exit 1 ;;
            esac
          done
          echo "PR checks passed"
