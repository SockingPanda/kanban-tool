[package]
name = "kanban-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kanban"
path = "src/main.rs"

[features]
default = []
tantivy-backend = [
  "kanban-search/tantivy-backend",
  "kanban-sqlite/tantivy-backend",
  "kanban-server/tantivy-backend",
]
graph-oxigraph = [
  "kanban-graph/graph-oxigraph",
  "kanban-server/graph-oxigraph",
  "kanban-sqlite/graph-oxigraph",
]
vector-lancedb = [
  "kanban-server/vector-lancedb",
  "kanban-sqlite/vector-lancedb",
  "kanban-vector/vector-lancedb",
]

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete = "4.5"
kanban-core.workspace = true
kanban-context.workspace = true
kanban-entity.workspace = true
kanban-graph.workspace = true
kanban-local.workspace = true
kanban-search.workspace = true
kanban-server.workspace = true
kanban-sqlite.workspace = true
kanban-vector.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
anyhow.workspace = true
assert_cmd = "2.0"
predicates = "3.1"
pretty_assertions = "1.4"
tempfile.workspace = true
