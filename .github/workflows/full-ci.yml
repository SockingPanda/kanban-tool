name: Full CI

on:
  push:
    branches:
      - main
      - "**full-ci**"
  workflow_dispatch:

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full repository gate
    runs-on: ubuntu-22.04
    env:
      # CI 无需调试符号，给完整工作区冷构建留出磁盘空间。
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # 受限 runner 上的内置 LLD 会崩溃；所有 Rust recipes 统一使用系统 linker。
      RUSTFLAGS: "-C linker-features=-lld"
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler \
            wget
      - name: Install Rust and gate tools
        uses: dtolnay/rust-toolchain@stable
      - name: Install just and Rust gate tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.57.0,cargo-nextest,cargo-deny,cargo-audit
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install Desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Run canonical full recipe
        run: just ci-full
