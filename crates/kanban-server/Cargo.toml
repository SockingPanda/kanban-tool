[package]
name = "kanban-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
tantivy-backend = [
  "kanban-search/tantivy-backend",
  "kanban-sqlite/tantivy-backend",
]
graph-oxigraph = [
  "kanban-graph/graph-oxigraph",
  "kanban-sqlite/graph-oxigraph",
]
vector-lancedb = [
  "kanban-sqlite/vector-lancedb",
  "kanban-vector/vector-lancedb",
]

[dependencies]
axum.workspace = true
futures-util = "0.3"
kanban-core.workspace = true
kanban-context.workspace = true
kanban-entity.workspace = true
kanban-graph.workspace = true
kanban-local.workspace = true
kanban-search.workspace = true
kanban-sqlite.workspace = true
kanban-vector.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
anyhow.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true
