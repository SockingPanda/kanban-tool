name: PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop-rust: ${{ steps.filter.outputs.desktop-rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
            desktop:
              - '.github/workflows/**'
              - 'apps/desktop/**'
            desktop-rust:
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/desktop/src-tauri/**'

  rust-default:
    name: Rust default features
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Check workspace
        run: cargo check --workspace --exclude kanban-desktop --tests
      - name: Test workspace
        run: cargo nextest run --workspace --exclude kanban-desktop --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude kanban-desktop -- -D warnings

  desktop:
    name: Desktop checks
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  desktop-rust:
    name: Desktop Rust checks
    needs: changes
    if: needs.changes.outputs.desktop-rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check Tauri Rust
        run: cargo check -p kanban-desktop --tests

  pr-result:
    name: PR result
    needs:
      - changes
      - rust-default
      - desktop
      - desktop-rust
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          changes_result='${{ needs.changes.result }}'
          rust_result='${{ needs.rust-default.result }}'
          desktop_result='${{ needs.desktop.result }}'
          desktop_rust_result='${{ needs.desktop-rust.result }}'
          if [[ "$changes_result" != "success" ]]; then
            echo "Changed-path detection finished with result: $changes_result"
            exit 1
          fi
          for result in "$rust_result" "$desktop_result" "$desktop_rust_result"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A gated PR job finished with result: $result"; exit 1 ;;
            esac
          done
          echo "PR checks passed"
