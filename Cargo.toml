[workspace]
members = [
  "crates/kanban-core",
  "crates/kanban-search",
  "crates/kanban-sqlite",
  "crates/kanban-local",
  "crates/kanban-cli",
  "crates/kanban-server",
  "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["kanban-user"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
dirs-next = "2.0"
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
tempfile = "3.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
ulid = "1.1"

kanban-core = { path = "crates/kanban-core" }
kanban-search = { path = "crates/kanban-search" }
kanban-sqlite = { path = "crates/kanban-sqlite" }
kanban-local = { path = "crates/kanban-local" }
kanban-server = { path = "crates/kanban-server" }
