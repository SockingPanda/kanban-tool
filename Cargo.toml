[workspace]
members = [
  "crates/kanban-core",
  "crates/kanban-sqlite",
  "crates/kanban-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["kanban-user"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs-next = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
ulid = "1.1"

kanban-core = { path = "crates/kanban-core" }
kanban-sqlite = { path = "crates/kanban-sqlite" }
