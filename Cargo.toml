[workspace]
members = [
  "crates/kanban-core",
  "crates/kanban-service",
  "crates/kanban-protocol",
  "xtask",
  "crates/kanban-client",
  "crates/kanban-cli",
  "crates/kanban-mcp",
  "crates/kanban-server",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/kanban-core",
  "crates/kanban-service",
  "crates/kanban-protocol",
  "crates/kanban-client",
  "crates/kanban-cli",
  "crates/kanban-mcp",
  "crates/kanban-server",
]
resolver = "3"

[profile.dev]
incremental = false

[workspace.package]
edition = "2024"
version = "2.1.3"
license = "Apache-2.0"
authors = ["SockingPanda"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
clap = "4.5"
clap_complete = "4.5"
dirs-next = "2.0"
http-body-util = "0.1"
serde = "1.0"
serde_json = "1.0"
serde_path_to_error = "0.1.20"
# Cargo 不允许 leaf 覆盖继承的默认 feature；这里仅固定关闭基线，具体 features 仍由 leaf 选择。
schemars = { version = "1.2.1", default-features = false }
jsonschema = { version = "0.47.0", default-features = false }
sha2 = "0.10"
rusqlite = "0.32"
strum = "0.26"
toml = "0.8"
ureq = { version = "2.12", default-features = false }
tempfile = "3.10"
thiserror = "2.0"
time = "0.3"
tokio = "1.38"
tower = "0.5"
tracing = "0.1.44"
ulid = "1.1"
turso = { version = "=0.7.2", default-features = false }
rmcp = { version = "=3.1.0", default-features = false }
tower-http = "0.6"
proptest = { version = "1.11.0", default-features = false }
tauri-build = "2"
tauri = "2"
tauri-plugin-single-instance = "2"
ksni = { version = "0.3.5", default-features = false }

kanban-core = { path = "crates/kanban-core" }
kanban-service = { path = "crates/kanban-service" }
kanban-protocol = { path = "crates/kanban-protocol", default-features = false }
kanban-client = { path = "crates/kanban-client" }
kanban-server = { path = "crates/kanban-server" }
