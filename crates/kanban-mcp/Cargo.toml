[package]
name = "kanban-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kanban-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
kanban-client.workspace = true
kanban-protocol = { workspace = true, default-features = false, features = ["schema"] }
rmcp = { workspace = true, default-features = false, features = ["server", "transport-io", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
