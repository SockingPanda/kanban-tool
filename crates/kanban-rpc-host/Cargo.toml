[package]
name = "kanban-rpc-host"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
kanban-live-core.workspace = true
kanban-rpc-proto.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "net", "time", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["transport", "codegen", "router"] }
tonic-web.workspace = true
prost.workspace = true
async-stream.workspace = true
tower-http = { workspace = true, features = ["cors"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tower.workspace = true
ulid.workspace = true
[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
reqwest = { workspace = true, features = ["stream"] }
