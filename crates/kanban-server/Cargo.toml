[package]
name = "kanban-server"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
oxigraph-backend = ["kanban-sqlite/oxigraph-backend"]
tantivy-backend = [
  "kanban-search/tantivy-backend",
  "kanban-sqlite/tantivy-backend",
]

[dependencies]
axum.workspace = true
futures-util = "0.3"
kanban-core.workspace = true
kanban-contract.workspace = true
kanban-application.workspace = true
kanban-derived-io.workspace = true
kanban-helper-protocol.workspace = true
kanban-context.workspace = true
kanban-entity.workspace = true
kanban-graph.workspace = true
kanban-local.workspace = true
kanban-search.workspace = true
kanban-sqlite.workspace = true
kanban-vector.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
tokio.workspace = true
tokio-util.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
kanban-test-support.workspace = true
anyhow.workspace = true
http-body-util.workspace = true
insta = { version = "1.48.0", features = ["json"] }
tempfile.workspace = true
tower.workspace = true
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
