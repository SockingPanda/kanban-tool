[package]
name = "kanban-sqlite"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
oxigraph-backend = ["dep:kanban-graph-oxigraph"]
tantivy-backend = ["dep:tantivy", "kanban-search/tantivy-backend"]

[dependencies]
kanban-application.workspace = true
kanban-core.workspace = true
kanban-context.workspace = true
kanban-contract.workspace = true
kanban-entity.workspace = true
kanban-graph.workspace = true
kanban-graph-oxigraph = { workspace = true, optional = true }
kanban-indexer.workspace = true
kanban-labels.workspace = true
kanban-local.workspace = true
kanban-search.workspace = true
kanban-vector.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tantivy = { workspace = true, optional = true }
thiserror.workspace = true

[[bench]]
name = "sqlite_service"
harness = false

[dev-dependencies]
anyhow.workspace = true
criterion = "0.8.2"
syn = { version = "2", features = ["full", "visit"] }
tempfile.workspace = true
trybuild = "1.0"
