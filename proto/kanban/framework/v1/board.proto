syntax = "proto3";
package kanban.framework.v1;

// 小范围纵向切片；不是原 main 的完整任务 DTO。
service BoardService {
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse);
  rpc WatchBoard(WatchBoardRequest) returns (stream BoardFrame);
}
service TaskService {
  rpc UpdateTaskTitle(UpdateTaskTitleRequest) returns (UpdateTaskTitleResponse);
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_TRIAGE = 1;
  TASK_STATUS_TODO = 2;
  TASK_STATUS_SCHEDULED = 3;
  TASK_STATUS_READY = 4;
  TASK_STATUS_RUNNING = 5;
  TASK_STATUS_BLOCKED = 6;
  TASK_STATUS_REVIEW = 7;
  TASK_STATUS_DONE = 8;
  TASK_STATUS_ARCHIVED = 9;
}
message TaskCard {
  string id = 1;
  string title = 2;
  TaskStatus status = 3;
  uint32 priority = 4;
  int64 position = 5;
  uint64 seq = 6;
  uint64 lock_version = 7;
}
// revision 属于 epoch + scope，绝不能填 task_events.id 或 lock_version。
message Cursor {
  string epoch = 1;
  string scope = 2;
  uint64 revision = 3;
}
message GetBoardRequest { string board_id = 1; }
message GetBoardResponse {
  string board_id = 1;
  Cursor cursor = 2;
  repeated TaskCard tasks = 3;
}
message WatchBoardRequest {
  string board_id = 1;
  Cursor resume = 2;
  uint32 protocol_version = 3;
}
message SnapshotBegin { uint64 revision = 1; uint32 count = 2; }
message SnapshotChunk { uint32 index = 1; repeated TaskCard tasks = 2; }
message SnapshotCommit { uint64 revision = 1; uint32 count = 2; uint32 chunks = 3; }
message BoardDelta {
  uint64 base_revision = 1;
  uint64 revision = 2;
  repeated TaskCard upserts = 3;
  repeated string removed_ids = 4;
}
message Heartbeat { uint64 server_revision = 1; }
// 收到 reset 后同一条流会开始完整快照；旧画面可保留到新 commit。
message ResetRequired { string reason = 1; }
message BoardFrame {
  string board_id = 1;
  string epoch = 2;
  string scope = 3;
  oneof body {
    SnapshotBegin snapshot_begin = 10;
    SnapshotChunk snapshot_chunk = 11;
    SnapshotCommit snapshot_commit = 12;
    BoardDelta delta = 13;
    Heartbeat heartbeat = 14;
    ResetRequired reset = 15;
  }
}
message UpdateTaskTitleRequest {
  string board_id = 1;
  string task_id = 2;
  string title = 3;
  string actor = 4;
  // 消息 presence 防止省略时被误当成版本 0。
  ExpectedVersion expected = 5;
}
message ExpectedVersion { uint64 value = 1; }
message UpdateTaskTitleResponse { TaskCard task = 1; }
// 放在自定义 kb-error-bin metadata 中，不冒充 google.rpc.Status。
message ErrorDetail { string code = 1; bool retryable = 2; }

// Atlas 的迁移期查询刷新流。无历史 cursor，重连总是先刷新现有查询。
// Card 投影尚不覆盖评论、标签和分页 total，不能把卡片变化冒充所有领域变化。
service WorkspaceService {
  rpc WatchChanges(WatchChangesRequest) returns (stream WorkspaceChangeFrame);
}
message WatchChangesRequest {
  string board_id = 1;
  uint32 protocol_version = 2;
}
enum RefreshReason {
  REFRESH_REASON_UNSPECIFIED = 0;
  REFRESH_REASON_ATTACHED = 1;
  REFRESH_REASON_WRITE_HINT = 2;
}
message QueriesInvalidated { RefreshReason reason = 1; }
message ConnectionHeartbeat {}
message WorkspaceChangeFrame {
  string board_id = 1;
  string epoch = 2;
  // 仅在当前连接内递增；不是 task_events.id、投影 revision 或 UI 已应用位置。
  uint64 sequence = 3;
  oneof body {
    QueriesInvalidated invalidated = 10;
    ConnectionHeartbeat heartbeat = 11;
  }
}
