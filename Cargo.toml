[workspace]
members = [
  "crates/kanban-core",
  "crates/kanban-application",
  "crates/kanban-contract",
  "crates/kanban-schema-tool",
  "crates/kanban-test-support",
  "crates/kanban-entity",
  "crates/kanban-indexer",
  "crates/kanban-search",
  "crates/kanban-graph",
  "crates/kanban-vector",
  "crates/kanban-derived-io",
  "crates/kanban-helper-protocol",
  "crates/kanban-vector-lancedb",
  "crates/kanban-graph-oxigraph",
  "crates/kanban-labels",
  "crates/kanban-context",
  "crates/kanban-sqlite",
  "crates/kanban-local",
  "crates/kanban-cli",
  "crates/kanban-server",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/kanban-core",
  "crates/kanban-contract",
  "crates/kanban-entity",
  "crates/kanban-indexer",
  "crates/kanban-search",
  "crates/kanban-graph",
  "crates/kanban-vector",
  "crates/kanban-derived-io",
  "crates/kanban-helper-protocol",
  "crates/kanban-labels",
  "crates/kanban-context",
  "crates/kanban-sqlite",
  "crates/kanban-local",
  "crates/kanban-cli",
  "crates/kanban-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.1.3"
license = "Apache-2.0"
authors = ["SockingPanda"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
dirs-next = "2.0"
http-body-util = "0.1"
fs-err = "3.1"
fs4 = "0.13"
lancedb = { version = "0.30.0", default-features = false }
arrow-array = "58.0"
arrow-schema = "58.0"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1.20"
schemars = { version = "1.2.1", default-features = false, features = ["std", "derive"] }
jsonschema = { version = "0.47.0", default-features = false }
sha2 = "0.10"
strum = { version = "0.26", features = ["derive"] }
tantivy = "0.26.1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["json"] }
oxigraph = { version = "0.5.8", default-features = false }
tempfile = "3.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ulid = "1.1"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
assert_fs = "1.1"

kanban-core = { path = "crates/kanban-core" }
kanban-application = { path = "crates/kanban-application" }
kanban-contract = { path = "crates/kanban-contract", default-features = false }
kanban-test-support = { path = "crates/kanban-test-support" }
kanban-entity = { path = "crates/kanban-entity" }
kanban-indexer = { path = "crates/kanban-indexer" }
kanban-search = { path = "crates/kanban-search" }
kanban-graph = { path = "crates/kanban-graph" }
kanban-vector = { path = "crates/kanban-vector" }
kanban-derived-io = { path = "crates/kanban-derived-io" }
kanban-helper-protocol = { path = "crates/kanban-helper-protocol" }
kanban-vector-lancedb = { path = "crates/kanban-vector-lancedb" }
kanban-graph-oxigraph = { path = "crates/kanban-graph-oxigraph" }
kanban-labels = { path = "crates/kanban-labels" }
kanban-context = { path = "crates/kanban-context" }
kanban-sqlite = { path = "crates/kanban-sqlite" }
kanban-local = { path = "crates/kanban-local" }
kanban-server = { path = "crates/kanban-server" }

# Oxigraph 0.5.x still publishes oxrdfxml/sparesults with quick-xml <0.41.
# Vendor the upstream security update until the same package versions are released
# with quick-xml 0.41 support (RUSTSEC-2026-0194/RUSTSEC-2026-0195).
[patch.crates-io]
oxrdfxml = { path = "vendor/oxrdfxml-0.2.3" }
sparesults = { path = "vendor/sparesults-0.3.3" }
