[package]
name = "kanban-schema-tool"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
autolib = false
build = false

[lib]
name = "kanban_schema_tool"
path = "src/lib.rs"

[dependencies]
jsonschema.workspace = true
kanban-contract = { workspace = true, default-features = false, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[bin]]
name = "kanban-schema"
path = "src/bin/kanban-schema.rs"

[[test]]
name = "tooling"
path = "tests/tooling.rs"
