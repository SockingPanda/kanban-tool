[workspace]
members = [
  "crates/kanban-core",
  "crates/kanban-entity",
  "crates/kanban-indexer",
  "crates/kanban-search",
  "crates/kanban-graph",
  "crates/kanban-vector",
  "crates/kanban-context",
  "crates/kanban-sqlite",
  "crates/kanban-local",
  "crates/kanban-cli",
  "crates/kanban-server",
  "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["kanban-user"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
dirs-next = "2.0"
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
tantivy = "0.26.1"
oxigraph = { version = "0.5.8", default-features = false }
tempfile = "3.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
ulid = "1.1"

kanban-core = { path = "crates/kanban-core" }
kanban-entity = { path = "crates/kanban-entity" }
kanban-indexer = { path = "crates/kanban-indexer" }
kanban-search = { path = "crates/kanban-search" }
kanban-graph = { path = "crates/kanban-graph" }
kanban-vector = { path = "crates/kanban-vector" }
kanban-context = { path = "crates/kanban-context" }
kanban-sqlite = { path = "crates/kanban-sqlite" }
kanban-local = { path = "crates/kanban-local" }
kanban-server = { path = "crates/kanban-server" }
